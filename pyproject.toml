[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lets-meet"
version = "0.1.0"
description = "AI & travel-time-fair meeting point recommender with dual map providers (Google Maps + Amap) and one-tap mobile navigation deep links."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
